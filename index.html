<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8586b">
<title>데이트 로그</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="데이트 로그">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#fff7f5;--card:#fff;--text:#2a2224;--sub:#7a6a6d;--line:#eedfdc;--accent:#e8586b;--accent-ink:#fff;--chip:#fbeeee;--star:#f5a623;--danger:#d33}
@media (prefers-color-scheme:dark){:root{--bg:#1a1517;--card:#262022;--text:#f3eaec;--sub:#a99a9d;--line:#3a3033;--accent:#ff7488;--accent-ink:#1a1517;--chip:#33282b;--danger:#ff6b6b}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 4px;max-width:600px;margin:0 auto}
h1{font-size:20px;margin:0}
main{padding:8px 16px 104px;max-width:600px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.empty{color:var(--sub);text-align:center;padding:48px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card-head{display:flex;gap:8px;align-items:flex-start}
.name{flex:1;font-size:18px;margin:0;word-break:break-all}
.badge{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:14px;white-space:nowrap;margin-top:2px}
.icon-btn{min-width:48px;min-height:48px;margin:-12px -12px -12px 0;border:0;background:none;color:var(--sub);font-size:20px}
.meta{color:var(--sub);font-size:14px;margin:4px 0 0}
.memo{margin:8px 0 0;white-space:pre-wrap;word-break:break-word}
.visits{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.visit{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;min-height:48px}
.vdate{font-weight:600}
.stars-sm{color:var(--star);margin-left:6px}
.review{display:block;color:var(--sub);font-size:15px;white-space:pre-wrap;word-break:break-word}

.btn{display:block;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-top:12px}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn.danger{background:none;color:var(--danger);border:1px solid currentColor}

nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;min-height:64px;border:0;background:none;font-weight:600;color:var(--sub)}
nav.tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:34px;line-height:1;box-shadow:0 4px 14px rgb(0 0 0/.25);z-index:5}

dialog{border:0;padding:0;width:100%;max-width:600px;margin:auto auto 0;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;background:var(--card);color:var(--text)}
dialog::backdrop{background:rgb(0 0 0/.45)}
dialog form{padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
dialog h2{margin:0 0 12px;font-size:19px;word-break:break-all}
label.field{display:block;margin-top:14px;font-weight:600}
fieldset{border:0;padding:0;margin:14px 0 0;min-width:0}
legend{font-weight:600;padding:0}
input[type=text],input[type=date],textarea{display:block;width:100%;min-height:48px;margin-top:6px;padding:12px;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px}
textarea{min-height:88px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-weight:500}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.stars{display:flex;gap:4px;margin-top:6px}
.star{position:relative}
.star input{position:absolute;opacity:0;inset:0;margin:0}
.star span{display:block;font-size:40px;line-height:52px;width:52px;text-align:center;color:var(--line)}
.star.on span{color:var(--star)}
.star input:focus-visible+span{outline:3px solid var(--accent);border-radius:8px}
.row{display:flex;gap:8px}
.row .btn{flex:1}
</style>
</head>
<body>
<header><h1>데이트 로그</h1></header>
<main id="list"></main>

<button class="fab" id="addBtn" aria-label="가고 싶은 곳 추가">+</button>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="wish" aria-selected="true">가고 싶은 곳</button>
  <button role="tab" data-tab="visited" aria-selected="false">가본 곳</button>
</nav>

<dialog id="placeDlg">
  <form id="placeForm" novalidate>
    <h2 id="placeTitle">가고 싶은 곳 추가</h2>
    <label class="field">장소 이름 <input type="text" name="name" required maxlength="60" autocomplete="off"></label>
    <fieldset><legend>종류</legend><div class="chips" id="typeChips"></div></fieldset>
    <label class="field">지역 <input type="text" name="region" maxlength="30" placeholder="예: 성수" autocomplete="off"></label>
    <fieldset><legend>비용 (둘이 합쳐서)</legend><div class="chips" id="costChips"></div></fieldset>
    <label class="field">메모 <textarea name="memo" maxlength="500"></textarea></label>
    <div class="row"><button type="button" class="btn ghost" data-close>취소</button><button class="btn">저장</button></div>
    <button type="button" class="btn danger" id="placeDel">이 장소 삭제</button>
  </form>
</dialog>

<dialog id="visitDlg">
  <form id="visitForm" novalidate>
    <h2 id="visitTitle">다녀왔어</h2>
    <label class="field">날짜 <input type="date" name="date" required></label>
    <fieldset><legend>별점</legend><div class="stars" id="stars"></div></fieldset>
    <label class="field">후기 <textarea name="review" maxlength="1000"></textarea></label>
    <div class="row"><button type="button" class="btn ghost" data-close>취소</button><button class="btn">저장</button></div>
    <button type="button" class="btn danger" id="visitDel">이 방문 기록 삭제</button>
  </form>
</dialog>

<script>
const KEY = 'dateLog';
const TYPES = { cafe: '카페', food: '음식점', play: '놀거리', walk: '산책', etc: '기타' };
// 둘이 합친 금액 구간. 숫자라서 추천에서 "cost <= 2" 같은 비교가 가능
const COSTS = { 1: '~1만', 2: '1~3만', 3: '3~5만', 4: '5만+' };
const empty = () => ({ version: 1, places: [], visits: [] });

/* 데이터 구조 (version 1)
   places: [{ id, name, type, region, cost(1~4|null), memo, createdAt }]
   visits: [{ id, placeId, date:"YYYY-MM-DD", rating:1~5, review, createdAt(ISO) }]
   visits를 장소 밖 평평한 배열로 둔 이유: "그날의 코스" = visits를 date로 묶고
   createdAt 순으로 정렬하면 바로 나옴. 백업은 이 객체 전체를 JSON으로. */

function load() {
  let raw;
  try { raw = localStorage.getItem(KEY); }
  catch { alert('이 브라우저에서는 저장이 막혀 있어요. 창을 닫으면 기록이 사라져요.'); return empty(); }
  if (!raw) return empty();
  try {
    const d = JSON.parse(raw);
    if (!Array.isArray(d.places) || !Array.isArray(d.visits)) throw 0;
    return d;
  } catch {
    // 깨진 데이터는 덮어쓰지 않고 따로 보관
    const k = KEY + '-broken-' + Date.now();
    try { localStorage.setItem(k, raw); } catch {}
    alert('저장된 기록을 읽지 못했어요. 원본은 "' + k + '"에 보관해뒀어요.');
    return empty();
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch { alert('저장에 실패했어요(저장 공간 부족일 수 있어요). 방금 입력은 반영되지 않았어요.'); return false; }
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toLocaleDateString('sv-SE'); // 로컬 기준 YYYY-MM-DD
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byNewest = (a, b) => b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt);

function split(d) {
  const has = new Set(d.visits.map(v => v.placeId));
  return { wish: d.places.filter(p => !has.has(p.id)), visited: d.places.filter(p => has.has(p.id)) };
}
const visitsOf = (d, id) => d.visits.filter(v => v.placeId === id).sort(byNewest);
function removePlace(d, id) {
  d.places = d.places.filter(p => p.id !== id);
  d.visits = d.visits.filter(v => v.placeId !== id); // 방문 기록도 같이 삭제
}

let db = load();
let tab = 'wish';
const $ = s => document.querySelector(s);

function card(p, vs) {
  const meta = [p.region && '📍 ' + esc(p.region), COSTS[p.cost] && '💰 ' + COSTS[p.cost]].filter(Boolean).join(' · ');
  const visits = vs.map(v => {
    const r = Math.max(0, Math.min(5, v.rating | 0));
    return `<li><button class="visit" data-act="editVisit" data-id="${esc(v.id)}" aria-label="${esc(v.date)} 방문 기록 수정">
      <span class="vdate">${esc(v.date)}</span><span class="stars-sm" aria-label="${r}점">${'★'.repeat(r)}${'☆'.repeat(5 - r)}</span>
      ${v.review ? `<span class="review">${esc(v.review)}</span>` : ''}</button></li>`;
  }).join('');
  return `<article class="card">
    <div class="card-head"><h2 class="name">${esc(p.name)}</h2>
      ${TYPES[p.type] ? `<span class="badge">${TYPES[p.type]}</span>` : ''}
      <button class="icon-btn" data-act="edit" data-id="${esc(p.id)}" aria-label="${esc(p.name)} 수정">✎</button></div>
    ${meta ? `<p class="meta">${meta}</p>` : ''}
    ${p.memo ? `<p class="memo">${esc(p.memo)}</p>` : ''}
    ${visits ? `<ul class="visits">${visits}</ul>` : ''}
    <button class="btn${vs.length ? ' ghost' : ''}" data-act="visit" data-id="${esc(p.id)}">${vs.length ? '또 다녀왔어 ✓' : '다녀왔어 ✓'}</button>
  </article>`;
}

function render() {
  const { wish, visited } = split(db);
  const tabs = document.querySelectorAll('nav.tabs button');
  tabs[0].textContent = `가고 싶은 곳 ${wish.length}`;
  tabs[1].textContent = `가본 곳 ${visited.length}`;
  tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  let html;
  if (tab === 'wish') {
    html = wish.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map(p => card(p, [])).join('')
      || '<p class="empty">아직 가고 싶은 곳이 없어요.<br>오른쪽 아래 + 를 눌러 추가해보세요.</p>';
  } else {
    html = visited.map(p => ({ p, vs: visitsOf(db, p.id) }))
      .sort((a, b) => byNewest(a.vs[0], b.vs[0]))
      .map(({ p, vs }) => card(p, vs)).join('')
      || '<p class="empty">아직 다녀온 곳이 없어요.<br>가고 싶은 곳에서 "다녀왔어"를 눌러보세요.</p>';
  }
  $('#list').innerHTML = html;
}

/* ---------- 폼 ---------- */
const chips = (name, obj) => Object.entries(obj).map(([v, t]) =>
  `<label class="chip"><input type="radio" name="${name}" value="${v}"><span>${t}</span></label>`).join('');
$('#typeChips').innerHTML = chips('type', TYPES);
$('#costChips').innerHTML = chips('cost', { '': '모름', ...COSTS });
$('#stars').innerHTML = [1, 2, 3, 4, 5].map(n =>
  `<label class="star"><input type="radio" name="rating" value="${n}" aria-label="${n}점"><span>★</span></label>`).join('');
function paintStars() {
  const r = +($('#visitForm').rating.value || 0);
  document.querySelectorAll('.star').forEach((el, i) => el.classList.toggle('on', i < r));
}
$('#stars').addEventListener('change', paintStars);
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
const setRadio = (form, name, val) => form.querySelectorAll(`[name=${name}]`).forEach(i => i.checked = i.value === String(val ?? ''));

let editingPlace = null;
function openPlace(p) {
  editingPlace = p;
  const f = $('#placeForm');
  f.reset();
  $('#placeTitle').textContent = p ? '장소 수정' : '가고 싶은 곳 추가';
  f.name.value = p?.name ?? '';
  f.region.value = p?.region ?? '';
  f.memo.value = p?.memo ?? '';
  setRadio(f, 'type', p?.type ?? 'cafe');
  setRadio(f, 'cost', p?.cost ?? '');
  $('#placeDel').hidden = !p;
  $('#placeDlg').showModal();
}
$('#placeForm').onsubmit = e => {
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  if (!name) { alert('장소 이름을 입력해주세요.'); f.name.focus(); return; }
  const data = { name, type: f.type.value || 'etc', region: f.region.value.trim(), cost: f.cost.value ? +f.cost.value : null, memo: f.memo.value.trim() };
  if (editingPlace) Object.assign(editingPlace, data);
  else db.places.push({ id: uid(), ...data, createdAt: new Date().toISOString() });
  save(); $('#placeDlg').close(); render();
};
$('#placeDel').onclick = () => {
  const n = visitsOf(db, editingPlace.id).length;
  if (!confirm(`"${editingPlace.name}"${n ? `와 방문 기록 ${n}개` : ''}를 삭제할까요?`)) return;
  removePlace(db, editingPlace.id);
  save(); $('#placeDlg').close(); render();
};

let visitCtx = null; // { place, visit|null }
function openVisit(place, visit) {
  visitCtx = { place, visit };
  const f = $('#visitForm');
  f.reset();
  $('#visitTitle').textContent = (visit ? '방문 기록 수정 · ' : '다녀왔어 · ') + place.name;
  f.date.value = visit?.date ?? today();
  setRadio(f, 'rating', visit?.rating);
  f.review.value = visit?.review ?? '';
  paintStars();
  $('#visitDel').hidden = !visit;
  $('#visitDlg').showModal();
}
$('#visitForm').onsubmit = e => {
  e.preventDefault();
  const f = e.target;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date.value)) { alert('날짜를 골라주세요.'); return; }
  if (!f.rating.value) { alert('별점을 눌러주세요.'); return; }
  const data = { date: f.date.value, rating: +f.rating.value, review: f.review.value.trim() };
  if (visitCtx.visit) Object.assign(visitCtx.visit, data);
  else db.visits.push({ id: uid(), placeId: visitCtx.place.id, ...data, createdAt: new Date().toISOString() });
  save(); $('#visitDlg').close();
  if (!visitCtx.visit) tab = 'visited';
  render();
};
$('#visitDel').onclick = () => {
  if (!confirm('이 방문 기록을 삭제할까요?')) return;
  db.visits = db.visits.filter(v => v !== visitCtx.visit);
  save(); $('#visitDlg').close(); render();
};

/* ---------- 이벤트 ---------- */
$('#addBtn').onclick = () => openPlace(null);
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); scrollTo(0, 0); });
$('#list').onclick = e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === 'editVisit') {
    const v = db.visits.find(v => v.id === id);
    return openVisit(db.places.find(p => p.id === v.placeId), v);
  }
  const p = db.places.find(p => p.id === id);
  b.dataset.act === 'edit' ? openPlace(p) : openVisit(p, null);
};
// 바깥(어두운 배경) 탭하면 시트 닫기
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

render();

/* ---------- 자체 점검: 주소 끝에 #test 를 붙여 열면 실행 ---------- */
if (location.hash === '#test') {
  const d = { version: 1, places: [{ id: 'a' }, { id: 'b' }], visits: [
    { id: 'v1', placeId: 'b', date: '2026-01-01', createdAt: '1' },
    { id: 'v2', placeId: 'b', date: '2026-02-01', createdAt: '2' }] };
  const s = split(d);
  const checks = [
    s.wish.length === 1 && s.wish[0].id === 'a',
    s.visited.length === 1 && s.visited[0].id === 'b',
    visitsOf(d, 'b')[0].id === 'v2',
    esc('<b>"') === '&lt;b&gt;&quot;',
    (removePlace(d, 'b'), d.places.length === 1 && d.visits.length === 0),
  ];
  document.title = checks.every(Boolean) ? 'TEST PASS' : 'TEST FAIL ' + checks.map(Number).join('');
}
</script>
</body>
</html>
